<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#111C33" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Cyan to Blue Gradient (Precision Arc & Monogram) -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Emerald to Teal Gradient (Ledger & Growth Bars) -->
    <linearGradient id="emeraldTealGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Royal Accent Gradient -->
    <linearGradient id="royalAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Reticle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base / App Tile -->
  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="3.5" />
  
  <!-- Subtle Internal Highlight Ring -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

  <!-- Central Reticle Circle / Precision Ring -->
  <circle cx="256" cy="246" r="148" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="256" cy="246" r="128" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-opacity="0.75" />

  <!-- Reticle Crosshair Ticks -->
  <line x1="256" y1="92" x2="256" y2="108" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="384" x2="256" y2="400" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="102" y1="246" x2="118" y2="246" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="394" y1="246" x2="410" y2="246" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />

  <!-- Precision Corner Markers -->
  <path d="M 160 160 L 140 160 L 140 180" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M 352 160 L 372 160 L 372 180" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M 140 312 L 140 332 L 160 332" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M 372 312 L 372 332 L 352 332" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Ledger Geometry: Ascending Balance & Growth Bars -->
  <!-- Column 1 (Base Tier) -->
  <rect x="176" y="278" width="26" height="66" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <!-- Column 2 (Active Tier) -->
  <rect x="216" y="246" width="26" height="98" rx="8" fill="url(#royalAccent)" />
  <!-- Column 3 (Peak Balance / Profit Tier) -->
  <rect x="256" y="210" width="26" height="134" rx="8" fill="url(#emeraldTealGrad)" filter="url(#subtleGlow)" />
  <!-- Column 4 (Expansion Tier) -->
  <rect x="296" y="174" width="26" height="170" rx="8" fill="url(#cyanBlueGrad)" />

  <!-- Iconic Monogram "د" + Precision Tick Mark Overlay -->
  <!-- Bold, modern swoosh forming the precision check/reticle tick seamlessly intersecting the ledger -->
  <path d="M 168 240 Q 230 330 262 338 T 356 160" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 168 240 Q 230 330 262 338 T 356 160" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Focal Reticle Core / Pinpoint Bullseye -->
  <circle cx="262" cy="338" r="9" fill="#FFFFFF" />
  <circle cx="262" cy="338" r="4.5" fill="#0EA5E9" />
  <circle cx="356" cy="160" r="7.5" fill="#38BDF8" />

  <!-- Lower Branding Dot: Precision Accuracy Indicator -->
  <circle cx="256" cy="426" r="6" fill="#10B981" />
  <circle cx="236" cy="426" r="4" fill="#334155" />
  <circle cx="276" cy="426" r="4" fill="#334155" />
</svg>
