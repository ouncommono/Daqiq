name: Daqiq CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Historical Packaging Reference (v4.8.3 / v4.8.4):
# Legacy flags migrated to Nuitka: --icon=assets/daqiq_logo.ico --add-data "assets;assets" (version 4.8.4)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install zstandard

      - name: Verify default_taxonomy.json integrity
        shell: pwsh
        run: |
          python -c "import json, pathlib; data = json.loads(pathlib.Path('default_taxonomy.json').read_text(encoding='utf-8')); assert isinstance(data, dict) and data.get('categories'), 'Invalid default_taxonomy.json'"
          Write-Output "default_taxonomy.json JSON contract verified."

      - name: Scan repository for signing secrets and residual build artifacts
        shell: pwsh
        run: |
          $keyPattern = "PRIVATE" + " " + "KEY"
          $priv = git grep -in "$keyPattern"
          if ($LASTEXITCODE -eq 0) {
            Write-Error "CRITICAL: Secret pattern detected in repository!"
            exit 1
          } elseif ($LASTEXITCODE -ne 1) {
            Write-Error "git grep encountered an unexpected error."
            exit 1
          }
          $global:LASTEXITCODE = 0
          Write-Output "Zero secrets found in tracked files."

      - name: Compile Python bytecode
        shell: pwsh
        run: python -m compileall -q .

      - name: Verify Hardware Fingerprint Acquisition
        shell: pwsh
        run: python -c "from licensing.device_identity import WindowsHardwareProvider; print('CI Hardware Fingerprint:', WindowsHardwareProvider().get_fingerprint())"

      - name: Run PyTest test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          PYTHONPATH: .
        shell: pwsh
        run: python -m pytest --timeout=120 -v

  build-nuitka-standalone:
    name: Build Nuitka Standalone (Stage A)
    needs: validate-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install zstandard

      - name: Verify Nuitka and MSVC Toolchain Detection
        shell: pwsh
        run: |
          python -m nuitka --version

      - name: Synchronize Embedded Key Shards
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
          DAQIQ_LICENSE_FP_PREFIX: ${{ vars.DAQIQ_LICENSE_FP_PREFIX }}
          DAQIQ_SUPPORT_PHONE: ${{ vars.DAQIQ_SUPPORT_PHONE }}
        run: |
          python tools/build_key_shards.py

      - name: Build Stage A Standalone Binary
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
          DAQIQ_LICENSE_FP_PREFIX: ${{ vars.DAQIQ_LICENSE_FP_PREFIX }}
          DAQIQ_SUPPORT_PHONE: ${{ vars.DAQIQ_SUPPORT_PHONE }}
        run: python scripts/build_nuitka.py --mode standalone

      - name: Verify Stage A Standalone Acceptance
        shell: pwsh
        run: python scripts/verify_nuitka_build.py --mode standalone

  build-nuitka-onefile:
    name: Build Nuitka Onefile (Stage B)
    needs: build-nuitka-standalone
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install zstandard

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "5.0.1" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Building Daqiq onefile for version: $ver"

      - name: Synchronize Embedded Key Shards
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
          DAQIQ_LICENSE_FP_PREFIX: ${{ vars.DAQIQ_LICENSE_FP_PREFIX }}
          DAQIQ_SUPPORT_PHONE: ${{ vars.DAQIQ_SUPPORT_PHONE }}
        run: |
          python tools/build_key_shards.py

      - name: Build Stage B Onefile Binary
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
          DAQIQ_LICENSE_FP_PREFIX: ${{ vars.DAQIQ_LICENSE_FP_PREFIX }}
          DAQIQ_SUPPORT_PHONE: ${{ vars.DAQIQ_SUPPORT_PHONE }}
        run: python scripts/build_nuitka.py --mode onefile

      - name: Verify Stage B Onefile Acceptance
        shell: pwsh
        run: python scripts/verify_nuitka_build.py --mode onefile

      - name: Verify Compiled Onefile Outer Executable Path Resolution (--print-paths)
        shell: pwsh
        run: |
          $smokeDir = "C:\daqiq_path_smoke"
          Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item "dist/Daqiq_${{ env.APP_VERSION }}.exe" "$smokeDir\Daqiq.exe"
          Copy-Item "dist/default_taxonomy.json" "$smokeDir\default_taxonomy.json"
          try {
            python -c "import subprocess, sys; p = subprocess.run([r'C:\daqiq_path_smoke\Daqiq.exe', '--print-paths'], cwd=r'C:\Windows\Temp', capture_output=True, text=True, timeout=30); print(p.stdout); sys.stderr.write(p.stderr); assert p.returncode == 0, p.returncode; assert r'EXECUTABLE_DIR=C:\daqiq_path_smoke' in p.stdout, p.stdout; assert r'DEFAULT_TAXONOMY_PATH=C:\daqiq_path_smoke\default_taxonomy.json' in p.stdout, p.stdout; assert r'AppData\Local\Daqiq' not in p.stdout.split('EXECUTABLE_DIR=')[1].splitlines()[0], p.stdout; print('PASS: Compiled onefile path check verified')"
            if ($LASTEXITCODE -ne 0) {
              exit 1
            }
          } finally {
            Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          }

      - name: Verify Compiled Onefile Post-DB MainWindow Launch (Create & Existing DB)
        shell: pwsh
        run: |
          $smokeRoot = "C:\daqiq_e2e_smoke"
          $smokeDbs = "C:\daqiq_e2e_smoke_dbs"
          Remove-Item -Recurse -Force $smokeRoot, $smokeDbs -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeRoot, $smokeDbs | Out-Null
          Copy-Item "dist/Daqiq_${{ env.APP_VERSION }}.exe" "$smokeRoot\Daqiq.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONFAULTHANDLER = "1"
          try {
            $smokePy = @'
          import os, shutil, subprocess, sys
          from pathlib import Path

          exe = r"C:\daqiq_e2e_smoke\Daqiq.exe"
          dbs = Path(r"C:\daqiq_e2e_smoke_dbs")
          local_app = Path(os.environ["LOCALAPPDATA"])
          logs = local_app / "Daqiq" / "logs"
          pre_sizes = {
              name: (logs / name).stat().st_size if (logs / name).is_file() else 0
              for name in ("daqiq_crash.log", "daqiq_native_fault.log")
          }

          # 1. Create new DB WITHOUT default_taxonomy.json
          db1 = dbs / "new_no_tax.db"
          p1 = subprocess.run([exe, "--smoke-launch-db", str(db1), "--smoke-launch-mode", "create"], cwd=r"C:\Windows\Temp", capture_output=True, text=True, timeout=60)
          print("SMOKE 1 STDOUT:", p1.stdout)
          print("SMOKE 1 STDERR:", p1.stderr)
          assert p1.returncode == 0, f"Create-without-taxonomy failed: {p1.returncode}"
          assert "DAQIQ_SMOKE_LAUNCH_OK" in p1.stdout, p1.stdout
          assert db1.is_file(), "DB1 was not created"

          # 2. Copy external default_taxonomy.json and Create new DB WITH taxonomy
          shutil.copy2("dist/default_taxonomy.json", r"C:\daqiq_e2e_smoke\default_taxonomy.json")
          db2 = dbs / "new_with_tax.db"
          p2 = subprocess.run([exe, "--smoke-launch-db", str(db2), "--smoke-launch-mode", "create"], cwd=r"C:\Windows\Temp", capture_output=True, text=True, timeout=60)
          print("SMOKE 2 STDOUT:", p2.stdout)
          print("SMOKE 2 STDERR:", p2.stderr)
          assert p2.returncode == 0, f"Create-with-taxonomy failed: {p2.returncode}"
          assert "DAQIQ_SMOKE_LAUNCH_OK" in p2.stdout, p2.stdout

          # 3. Connect Existing DB
          p3 = subprocess.run([exe, "--smoke-launch-db", str(db2), "--smoke-launch-mode", "existing"], cwd=r"C:\Windows\Temp", capture_output=True, text=True, timeout=60)
          print("SMOKE 3 STDOUT:", p3.stdout)
          print("SMOKE 3 STDERR:", p3.stderr)
          assert p3.returncode == 0, f"Connect-existing failed: {p3.returncode}"
          assert "DAQIQ_SMOKE_LAUNCH_OK" in p3.stdout, p3.stdout

          # 4. Assert zero new crash or native fault log output
          for log_name, prev_size in pre_sizes.items():
              lp = logs / log_name
              if lp.is_file():
                  data = lp.read_bytes()[prev_size:]
                  content = data.decode("utf-8", errors="replace").strip()
                  assert not content, f"Unexpected {log_name} content:\n{content}"
          print("PASS: Compiled Windows onefile post-DB MainWindow launch verified for Create & Existing DB.")
          '@
            $smokePy | python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))"
            if ($LASTEXITCODE -ne 0) {
              exit 1
            }
          } finally {
            Remove-Item -Recurse -Force $smokeRoot, $smokeDbs -ErrorAction SilentlyContinue
          }

      - name: Verify Onefile Executable Size and Optimization
        shell: pwsh
        run: |
          $exe = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          $tsExe = "dist/Daqiq-Troubleshooter.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Target executable not found: $exe"
            exit 1
          }
          if (-not (Test-Path $tsExe)) {
            Write-Error "Troubleshooter executable not found: $tsExe"
            exit 1
          }
          $bytes = (Get-Item $exe).Length
          $mb = [math]::Round($bytes / 1MB, 2)
          $tsBytes = (Get-Item $tsExe).Length
          $tsMb = [math]::Round($tsBytes / 1MB, 2)
          Write-Output "Optimized Daqiq Executable Size: $mb MB ($bytes bytes)"
          Write-Output "Zero-Qt Troubleshooter Executable Size: $tsMb MB ($tsBytes bytes)"
          if ($tsBytes -gt 15MB) {
            Write-Error "Daqiq-Troubleshooter.exe ($tsMb MB) exceeds 15 MB limit — must be zero-Qt!"
            exit 1
          }

      - name: Scan built artifacts for signing secrets
        shell: pwsh
        run: |
          $keyPattern = "PRIVATE" + " " + "KEY"
          $found = Select-String -Path dist/SHA256SUMS.txt -Pattern $keyPattern
          if ($found) {
            Write-Error "Secret pattern found in output artifacts!"
            exit 1
          }
          Write-Output "Artifact security scan clean."

      - name: Upload Windows Production Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Daqiq-Windows-v${{ env.APP_VERSION }}
          path: |
            dist/Daqiq_${{ env.APP_VERSION }}.exe
            dist/Daqiq-Troubleshooter.exe
            dist/default_taxonomy.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    name: Publish Production GitHub Release
    needs: build-nuitka-onefile
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "5.0.1" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: Daqiq-Windows-v${{ env.APP_VERSION }}
          path: dist

      - name: Verify SHA256 Checksums
        shell: pwsh
        run: |
          Get-Content dist/SHA256SUMS.txt
          foreach ($target in @("dist/Daqiq_${{ env.APP_VERSION }}.exe", "dist/Daqiq-Troubleshooter.exe")) {
            if (-not (Test-Path $target)) {
              Write-Error "Target executable not found: $target"
              exit 1
            }
            $actualSha = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLower()
            Write-Output "Verified SHA256 ($target): $actualSha"
          }

      - name: Ensure Open Pull Request to main (Unmerged)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branchOut = git branch --show-current 2>$null
          $currentBranch = ($branchOut | Out-String).Trim()
          if (-not $currentBranch) {
            $currentBranch = "${{ github.head_ref || github.ref_name }}"
          }
          Write-Output "Checking for existing PR from $currentBranch to main..."
          $existingPr = gh pr list --head $currentBranch --base main --json number --jq '.[0].number'
          if ($existingPr) {
            Write-Output "Pull request #$existingPr already exists."
          } else {
            Write-Output "Creating open PR from $currentBranch to main..."
            gh pr create `
              --base main `
              --head $currentBranch `
              --title "Release v${{ env.APP_VERSION }} - Multi-Item Invoices, Check Ledger, LAN Invoice Resolution, User Performance & Full UI/UX Upgrade" `
              --body "Daqiq v${{ env.APP_VERSION }} Final Commercial Release featuring multi-item atomic Purchases/Sales/Services invoices, full Check Management & Suppliers/Customers clearance, 3-option LAN duplicate invoice conflict resolution, barcode/code Enter selection, unified Installment status, 4-card Customers KPI & User Performance reporting, semantic neutral-zero coloring, and Complete-Wipe Zero-Qt Troubleshooter. Strictly unmerged."
          }

      - name: Publish Official Release on Matching Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "Daqiq $tag"
          $exePath = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          $tsPath = "dist/Daqiq-Troubleshooter.exe"
          $taxPath = "dist/default_taxonomy.json"
          $sumsPath = "dist/SHA256SUMS.txt"

          Write-Output "Publishing official release for tag $tag..."
          $existingRel = gh release view $tag 2>$null
          if ($existingRel) {
            Write-Output "Release $tag already exists, uploading assets..."
            gh release upload $tag $exePath $tsPath $taxPath $sumsPath --clobber
          } else {
            Write-Output "Creating release $tag marked as Latest..."
            gh release create $tag $exePath $tsPath $taxPath $sumsPath `
              --title $title `
              --notes "Daqiq $tag official commercial offline licensing & LAN multi-PC release. Includes Daqiq_${{ env.APP_VERSION }}.exe, Daqiq-Troubleshooter.exe, external default_taxonomy.json, and SHA256SUMS.txt." `
              --latest `
              --prerelease=false
          }
