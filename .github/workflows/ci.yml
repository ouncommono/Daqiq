name: Daqiq CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (node24)
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest openpyxl pyinstaller

      - name: Compile Python bytecode
        run: python -m compileall -q .

      - name: Run PyTest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-executable:
    name: Build Standalone Executable
    needs: validate-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (node24)
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller openpyxl

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.6.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Building for version: $ver"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --hidden-import sqlcipher3 --name "Daqiq_${{ env.APP_VERSION }}" main.py

      - name: Copy Companion Taxonomy File & Build Portable Bundle
        shell: pwsh
        run: |
          Copy-Item default_taxonomy.json dist/default_taxonomy.json -Force
          $readme = @"
          Daqiq Retail Management System v${{ env.APP_VERSION }}
          =============================================
          Portable Distribution Layout:
          - Daqiq_${{ env.APP_VERSION }}.exe : Application standalone binary (PyInstaller)
          - default_taxonomy.json   : Editable external catalog taxonomy sidecar
          - SHA256SUMS.txt          : Cryptographic asset checksums

          Catalog Behavior:
          - If default_taxonomy.json is present beside the executable when creating a new database,
            it seeds the standard hardware taxonomy.
          - If default_taxonomy.json is missing when creating a new database, Daqiq initializes
            with strictly zero categories, zero subcategories, and zero custom technical specifications.
          "@
          Set-Content -Path "dist/README.txt" -Value $readme -Encoding utf8
          
          # Generate SHA256SUMS.txt
          Get-FileHash -Path "dist/Daqiq_${{ env.APP_VERSION }}.exe", "dist/default_taxonomy.json" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8
          
          # Package portable zip
          Compress-Archive -Path "dist/Daqiq_${{ env.APP_VERSION }}.exe", "dist/default_taxonomy.json", "dist/README.txt", "dist/SHA256SUMS.txt" -DestinationPath "dist/Daqiq_${{ env.APP_VERSION }}_Portable.zip" -Force

      - name: Validate Built Binary via Self-Test
        shell: pwsh
        run: |
          $target = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          if (-not (Test-Path $target)) {
            Write-Error "Binary build output not found: $target"
            exit 1
          }
          $bytes = (Get-Item $target).Length
          Write-Output "Executable built successfully: $target ($bytes bytes)"
          Write-Output "Running noninteractive binary self-test..."
          & $target --self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Binary self-test failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Output "Binary self-test passed successfully."

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: Daqiq-Windows-${{ env.APP_VERSION }}
          path: |
            dist/Daqiq_${{ env.APP_VERSION }}.exe
            dist/default_taxonomy.json
            dist/Daqiq_${{ env.APP_VERSION }}_Portable.zip
            dist/SHA256SUMS.txt
            dist/README.txt
          if-no-files-found: error

  publish-release:
    name: Publish Release (Tags Only)
    needs: build-executable
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          fetch-depth: 0

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.6.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Download Build Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (node24)
        with:
          name: Daqiq-Windows-${{ env.APP_VERSION }}
          path: dist

      - name: Publish Release Tagged as v4.6.0 and Marked as Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          $title = "Daqiq v${{ env.APP_VERSION }} (Retail Production Release)"
          $exePath = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          $taxPath = "dist/default_taxonomy.json"
          $zipPath = "dist/Daqiq_${{ env.APP_VERSION }}_Portable.zip"
          $sumPath = "dist/SHA256SUMS.txt"
          Write-Output "Publishing release tagged $tag marked as Latest..."
          gh release create $tag $exePath $taxPath $zipPath $sumPath `
            --title $title `
            --notes "Daqiq v${{ env.APP_VERSION }} official retail production release. Full SQLCipher 4 encryption, clean taxonomy architecture, transactional report settings, form field swaps, and native Node 24 immutable build provenance." `
            --latest `
            --verify-tag `
            --prerelease=false
