name: Python validation

on:
  push:
    branches:
      - main
      - feature/accounting-security-ux-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Keep only the latest validation run for each PR/ref; rapid fix commits
# must not leave stale UI test runs competing for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 openpyxl jdatetime pytest
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run database regression tests
        run: python -m pytest -q
