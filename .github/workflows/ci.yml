name: Daqiq CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Historical Packaging Reference (v4.8.3 / v4.8.4):
# Legacy flags migrated to Nuitka: --icon=assets/daqiq_logo.ico --add-data "assets;assets" (version 4.8.4)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install zstandard

      - name: Verify zero diff on database.py and default_taxonomy.json
        shell: pwsh
        run: |
          git diff --exit-code -- database.py default_taxonomy.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CRITICAL: database.py or default_taxonomy.json was modified! Zero database changes permitted."
            exit 1
          }
          Write-Output "Zero diff verified on database.py and default_taxonomy.json"

      - name: Scan repository for signing secrets and residual build artifacts
        shell: pwsh
        run: |
          $keyPattern = "PRIVATE" + " " + "KEY"
          $priv = git grep -in "$keyPattern"
          if ($LASTEXITCODE -eq 0) {
            Write-Error "CRITICAL: Secret pattern detected in repository!"
            exit 1
          } elseif ($LASTEXITCODE -ne 1) {
            Write-Error "git grep encountered an unexpected error."
            exit 1
          }
          $global:LASTEXITCODE = 0
          Write-Output "Zero secrets found in tracked files."

      - name: Compile Python bytecode
        shell: pwsh
        run: python -m compileall -q .

      - name: Verify Hardware Fingerprint Acquisition
        shell: pwsh
        run: python -c "from licensing.device_identity import WindowsHardwareProvider; print('CI Hardware Fingerprint:', WindowsHardwareProvider().get_fingerprint())"

      - name: Run PyTest test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        shell: pwsh
        run: python -m pytest --timeout=60 -v

  build-nuitka-standalone:
    name: Build Nuitka Standalone (Stage A)
    needs: validate-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install zstandard

      - name: Verify Nuitka and MSVC Toolchain Detection
        shell: pwsh
        run: |
          python -m nuitka --version

      - name: Synchronize Embedded Key Shards
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
        run: |
          python tools/build_key_shards.py

      - name: Build Stage A Standalone Binary
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
        run: python scripts/build_nuitka.py --mode standalone

      - name: Verify Stage A Standalone Acceptance
        shell: pwsh
        run: python scripts/verify_nuitka_build.py --mode standalone

  build-nuitka-onefile:
    name: Build Nuitka Onefile (Stage B)
    needs: build-nuitka-standalone
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install zstandard

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.9.3" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Building Daqiq onefile for version: $ver"

      - name: Synchronize Embedded Key Shards
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
        run: |
          python tools/build_key_shards.py

      - name: Build Stage B Onefile Binary
        shell: pwsh
        env:
          DAQIQ_LICENSE_PUBLIC_KEY_B64: ${{ secrets.DAQIQ_LICENSE_PUBLIC_KEY_B64 }}
          DAQIQ_LICENSE_KEY_ID: ${{ vars.DAQIQ_LICENSE_KEY_ID }}
        run: python scripts/build_nuitka.py --mode onefile

      - name: Verify Stage B Onefile Acceptance
        shell: pwsh
        run: python scripts/verify_nuitka_build.py --mode onefile

      - name: Verify Onefile Executable Size and Optimization
        shell: pwsh
        run: |
          $exe = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Target executable not found: $exe"
            exit 1
          }
          $bytes = (Get-Item $exe).Length
          $mb = [math]::Round($bytes / 1MB, 2)
          Write-Output "Optimized Executable Size: $mb MB ($bytes bytes)"

      - name: Scan built artifacts for signing secrets
        shell: pwsh
        run: |
          $keyPattern = "PRIVATE" + " " + "KEY"
          $found = Select-String -Path dist/SHA256SUMS.txt -Pattern $keyPattern
          if ($found) {
            Write-Error "Secret pattern found in output artifacts!"
            exit 1
          }
          Write-Output "Artifact security scan clean."

      - name: Upload Windows Production Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Daqiq-Windows-v${{ env.APP_VERSION }}
          path: |
            dist/Daqiq_${{ env.APP_VERSION }}.exe
            dist/default_taxonomy.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    name: Publish Production GitHub Release
    needs: build-nuitka-onefile
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.9.3" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: Daqiq-Windows-v${{ env.APP_VERSION }}
          path: dist

      - name: Verify SHA256 Checksums
        shell: pwsh
        run: |
          Get-Content dist/SHA256SUMS.txt
          $target = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          if (-not (Test-Path $target)) {
            Write-Error "Target executable not found: $target"
            exit 1
          }
          $actualSha = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLower()
          Write-Output "Verified SHA256: $actualSha"

      - name: Ensure Open Pull Request to main (Unmerged)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $currentBranch = (git branch --show-current).Trim()
          if (-not $currentBranch) {
            $currentBranch = "${{ github.ref_name }}"
          }
          Write-Output "Checking for existing PR from $currentBranch to main..."
          $existingPr = gh pr list --head $currentBranch --base main --json number --jq '.[0].number'
          if ($existingPr) {
            Write-Output "Pull request #$existingPr already exists."
          } else {
            Write-Output "Creating open PR from $currentBranch to main..."
            gh pr create `
              --base main `
              --head $currentBranch `
              --title "Release v${{ env.APP_VERSION }} - Anti-Crack Ed25519 Key Architecture, Protocol Parity & Production Release" `
              --body "Daqiq v${{ env.APP_VERSION }} Commercial Production Release with anti-crack XOR-masked Ed25519 key sharding, 100% protocol parity with Daqiq-License-Generator, developer license key tool, ultra-fast native Win32 SMBIOS hardware fingerprinting (<5ms), multi-anchor clock tampering defense, Nuitka cached onefile optimization, and Node 24 CI/CD. Strictly unmerged."
          }

      - name: Publish Official Release on Matching Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "Daqiq $tag"
          $exePath = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          $taxPath = "dist/default_taxonomy.json"
          $sumsPath = "dist/SHA256SUMS.txt"

          Write-Output "Publishing official release for tag $tag..."
          $existingRel = gh release view $tag 2>$null
          if ($existingRel) {
            Write-Output "Release $tag already exists, uploading assets..."
            gh release upload $tag $exePath $taxPath $sumsPath --clobber
          } else {
            Write-Output "Creating release $tag marked as Latest..."
            gh release create $tag $exePath $taxPath $sumsPath `
              --title $title `
              --notes "Daqiq $tag official commercial offline licensing production release. Includes optimized standalone executable, external default_taxonomy.json, and SHA256SUMS.txt." `
              --latest `
              --prerelease=false
          }
