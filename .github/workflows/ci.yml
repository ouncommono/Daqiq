name: Daqiq CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest openpyxl pyinstaller

      - name: Compile Python bytecode
        run: python -m compileall -q .

      - name: Run PyTest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-executable:
    name: Build Standalone Executable
    needs: validate-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller openpyxl

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.6.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Building for version: $ver"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --hidden-import sqlcipher3 --name "Daqiq_${{ env.APP_VERSION }}" main.py

      - name: Copy Companion Taxonomy File
        shell: pwsh
        run: |
          Copy-Item default_taxonomy.json dist/default_taxonomy.json -Force

      - name: Validate Built Binary
        shell: pwsh
        run: |
          $target = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          if (-not (Test-Path $target)) {
            Write-Error "Binary build output not found: $target"
            exit 1
          }
          $bytes = (Get-Item $target).Length
          Write-Output "Executable built successfully: $target ($bytes bytes)"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Daqiq-Windows-${{ env.APP_VERSION }}
          path: |
            dist/Daqiq_${{ env.APP_VERSION }}.exe
            dist/default_taxonomy.json
          if-no-files-found: error

  draft-release-or-pr:
    name: Draft Release and Open PR
    needs: build-executable
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.6.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: Daqiq-Windows-${{ env.APP_VERSION }}
          path: dist

      - name: Create Open Pull Request (Release/Feature Branches)
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rule: Do NOT auto-merge this PR in the workflow. Register it solely as an open PR ready for final human code review and validation.
          $currentBranch = (git branch --show-current).Trim()
          Write-Output "Checking open PR from $currentBranch to main..."
          $existingPr = $null
          try {
            $existingPr = gh pr list --head $currentBranch --base main --state open --json number --jq '.[0].number' 2>$null
          } catch {}
          if (-not $existingPr) {
            Write-Output "Creating open PR from $currentBranch to main..."
            gh pr create `
              --base main `
              --head $currentBranch `
              --title "Release v${{ env.APP_VERSION }}: Standard SQLCipher 4 Encryption, Clean Taxonomy Architecture, and Retail UI/UX Polish" `
              --body "Comprehensive retail production release v${{ env.APP_VERSION }}. This PR contains standard SQLCipher 4 encryption (100% out-of-the-box compatibility with DB Browser for SQLite with plain UTF-8 passphrase), robust taxonomy initialization (0 categories/subcategories/attributes when default_taxonomy.json is missing, clean deduplication without cross-contamination when present), enlarged two-column catalog management UI with minimal scrolling, surgical rollback of unrequested v4.4.6 behavioral drifts, and native Node 24 GitHub Actions workflows with zero deprecation warnings. Registered solely for human code review and validation (auto-merge disabled)."
          } else {
            Write-Output "Pull request already exists: #$existingPr"
          }

      - name: Publish Release Tagged as v4.6.0 and Marked as Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          $title = "Daqiq v${{ env.APP_VERSION }} (Retail Production Release)"
          $exePath = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          $taxPath = "dist/default_taxonomy.json"
          Write-Output "Checking release status for tag $tag..."
          $relExists = $false
          try {
            $null = gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) { $relExists = $true }
          } catch {}
          if (-not $relExists) {
            Write-Output "Publishing release tagged $tag marked as Latest..."
            gh release create $tag $exePath $taxPath `
              --title $title `
              --notes "Daqiq v${{ env.APP_VERSION }} official retail production release. Executable packaged with PyInstaller alongside companion default_taxonomy.json." `
              --latest `
              --prerelease=false
          } else {
            Write-Output "Release $tag already exists. Uploading assets..."
            gh release upload $tag $exePath $taxPath --clobber
          }
