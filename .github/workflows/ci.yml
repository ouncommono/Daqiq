name: Daqiq CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout openpyxl pyinstaller

      - name: Compile Python bytecode
        run: python -m compileall -q .

      - name: Run PyTest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --timeout=60 -v

  build-executable:
    name: Build Standalone Executable
    needs: validate-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller openpyxl

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.6.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Building for version: $ver"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Daqiq_${{ env.APP_VERSION }}" main.py

      - name: Copy External Standalone Taxonomy
        shell: pwsh
        run: |
          Copy-Item default_taxonomy.json dist/default_taxonomy.json
          Write-Output "External default_taxonomy.json placed in dist alongside executable."

      - name: Validate Built Binary
        shell: pwsh
        run: |
          $target = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          if (-not (Test-Path $target)) {
            Write-Error "Binary build output not found: $target"
            exit 1
          }
          $bytes = (Get-Item $target).Length
          Write-Output "Executable built successfully: $target ($bytes bytes)"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daqiq-Windows-${{ env.APP_VERSION }}
          path: |
            dist/Daqiq_${{ env.APP_VERSION }}.exe
            dist/default_taxonomy.json
          if-no-files-found: error

  draft-release-or-pr:
    name: Draft Release and Open PR
    needs: build-executable
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.6.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: Daqiq-Windows-${{ env.APP_VERSION }}
          path: dist

      - name: Create Open Pull Request (Release/Feature Branches)
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rule: Do NOT auto-merge this PR in the workflow. Register it solely as an open PR ready for final human code review and validation.
          $currentBranch = (git branch --show-current).Trim()
          Write-Output "Creating or checking open PR from $currentBranch to main..."
          gh pr create `
            --base main `
            --head $currentBranch `
            --title "Release v${{ env.APP_VERSION }}: Final Production Release" `
            --body "Final production release v${{ env.APP_VERSION }}. Features clean-slate schema v460, total purge of hardcoded taxonomy, external seed architecture, deep bilingual hardware taxonomy, true SQLCipher AES-256 database encryption, sales form reset fix, transactional Excel export settings staging, and expanded ergonomic UI layout. Auto-merge is strictly prohibited." 2>$null || Write-Output "Pull request already exists."

      - name: Publish Release Tagged as v4.6.0 and Marked as Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          $title = "Daqiq v${{ env.APP_VERSION }} (Final Production Release)"
          $exePath = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          $taxPath = "dist/default_taxonomy.json"
          Write-Output "Publishing release tagged $tag marked as Latest with executable and taxonomy attached..."
          gh release create $tag $exePath $taxPath `
            --title $title `
            --notes "Daqiq v${{ env.APP_VERSION }} official retail store management production release. Includes standalone executable and external default_taxonomy.json." `
            --latest `
            --prerelease=false 2>$null || `
          gh release upload $tag $exePath $taxPath --clobber
