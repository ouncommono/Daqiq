name: Daqiq Release Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    name: Build and Release Standalone Executable
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller openpyxl

      - name: Read Application Version
        id: version_step
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "4.2.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Building release for version: $ver"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Daqiq_${{ env.APP_VERSION }}" --collect-all customtkinter main.py

      - name: Validate Binary
        shell: pwsh
        run: |
          $target = "dist/Daqiq_${{ env.APP_VERSION }}.exe"
          if (-not (Test-Path $target)) {
            Write-Error "Binary build output not found: $target"
            exit 1
          }
          $bytes = (Get-Item $target).Length
          Write-Output "Executable built successfully: $target ($bytes bytes)"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daqiq-Windows-${{ env.APP_VERSION }}
          path: dist/Daqiq_${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        with:
          tag_name: Latest
          name: Daqiq v${{ env.APP_VERSION }} (Latest Release)
          body: |
            ## Daqiq Enterprise Store Management System v${{ env.APP_VERSION }}
            Official production release package.
            
            ### Highlights in v${{ env.APP_VERSION }}:
            - Clean slate SQLite database schema v420 with normalized JSON/EAV specifications.
            - Explicit Serial Number rendering and auto-population observer pattern across all workflows.
            - Bilingual taxonomy standardization with Persian keys, English labels and English values.
            - Customer contact number integration with mandatory sales validation.
            - Configurable minimum stock defaults persisted across application lifecycle.
            - Dynamic custom backup directory configuration.
            - Robust 60,000ms heartbeat timer eliminating system sleep/wake OverflowError.
            - Card frame modern UI styling with responsive settings actions.
            - Full CustomTkinter asset bundling for PyInstaller.
          files: dist/Daqiq_${{ env.APP_VERSION }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
